<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{BLURB}}" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/asciinema-player@3.17.0/dist/bundle/asciinema-player.css"
    />
    <style>
      :root {
        --ink: #1c1917;
        --muted: #57534e;
        --faint: #8c8681;
        --line: #e7e5e4;
        --bg: #ffffff;
        --card: #ffffff;
        --soft: #fafaf9;
        --sans:
          ui-sans-serif, -apple-system, "Segoe UI", system-ui, "PingFang TC",
          "Noto Sans TC", sans-serif;
        --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.6 var(--sans);
      }
      ::backdrop {
        background: #fff;
      }
      #app {
        display: grid;
        grid-template-rows: auto 1fr;
        grid-template-columns: minmax(0, 1fr);
        height: 100vh;
        background: var(--bg);
      }
      header {
        min-width: 0;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 24px;
        min-height: 60px;
        padding: 10px 20px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
        white-space: nowrap;
      }
      header .blurb {
        color: var(--muted);
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      header .facts {
        display: flex;
        gap: 18px;
      }
      header .facts div {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.2;
      }
      header .facts b {
        font-size: 15px;
      }
      header .facts span {
        font-size: 12px;
        color: var(--faint);
      }
      header nav {
        display: flex;
        gap: 14px;
        font-size: 13px;
        white-space: nowrap;
      }
      header nav a {
        color: var(--muted);
        text-decoration: none;
        cursor: pointer;
      }
      header nav a:hover {
        color: var(--ink);
      }
      main {
        display: grid;
        grid-template-columns: 272px minmax(0, 1fr);
        min-height: 0;
      }
      #rail {
        border-right: 1px solid var(--line);
        overflow-y: auto;
        padding: 6px 0 24px;
      }
      #rail .part {
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--faint);
        padding: 14px 14px 4px;
      }
      #rail button {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 4px;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        padding: 6px 14px;
        font: 13px/1.45 var(--sans);
        color: var(--muted);
        cursor: pointer;
      }
      #rail button.say {
        padding-left: 42px;
        font-size: 12px;
      }
      #rail button .n,
      #rail button .t {
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      #rail button:hover {
        color: var(--ink);
      }
      #rail button[aria-current="true"] {
        color: var(--ink);
        font-weight: 600;
        background: var(--soft);
      }
      #stage {
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 0;
        min-width: 0;
      }
      #screen {
        position: relative;
        min-height: 0;
        background: var(--bg);
      }
      #player {
        position: absolute;
        inset: 0;
      }
      #player .ap-wrapper,
      #player .ap-player {
        background: #fff;
      }
      .overlay {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: var(--card);
        overflow-y: auto;
      }
      .hidden {
        display: none !important;
      }
      #endbar {
        position: absolute;
        right: 14px;
        bottom: 14px;
        z-index: 15;
        display: flex;
        gap: 10px;
        align-items: center;
        max-width: calc(100% - 28px);
        padding: 8px 8px 8px 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        font-size: 13px;
        color: var(--muted);
      }
      #endbar span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #endbar .btn {
        padding: 6px 14px;
        flex: none;
      }
      #brief {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 40px 56px;
      }
      #brief .label {
        font-size: 12px;
        color: var(--faint);
        letter-spacing: 0.08em;
        margin-bottom: 14px;
      }
      #brieftext {
        font-size: 22px;
        line-height: 1.9;
        max-width: 40ch;
        white-space: pre-wrap;
        margin: 0 0 12px;
      }
      #briefnote {
        color: var(--muted);
        font-size: 14px;
        max-width: 62ch;
        margin: 0 0 28px;
      }
      #brieftext b {
        font-weight: 700;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .btn {
        font: 600 13px var(--sans);
        letter-spacing: 0.14em;
        color: #fff;
        background: var(--ink);
        border: 0;
        padding: 11px 22px;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn.ghost {
        color: var(--ink);
        background: none;
        border: 1px solid var(--line);
        letter-spacing: 0.04em;
        font-weight: 500;
      }
      .sheet {
        position: absolute;
        inset: 0;
        z-index: 30;
        background: var(--card);
        padding: 40px 56px;
        overflow-y: auto;
        display: none;
      }
      .sheet.open {
        display: block;
      }
      .sheet .close {
        position: absolute;
        top: 14px;
        right: 18px;
        background: none;
        border: 1px solid var(--line);
        border-radius: 4px;
        font: 13px var(--sans);
        color: var(--muted);
        padding: 4px 10px;
        cursor: pointer;
      }
      #sheet-about .body {
        max-width: 66ch;
      }
      /* Milestones: what each stage produced, taken from that stage's git version */
      #sheet-ms .intro {
        color: var(--muted);
        max-width: 70ch;
        margin: 0 0 22px;
      }
      .ms {
        border-top: 1px solid var(--line);
        padding: 18px 0 20px;
        scroll-margin-top: 8px;
      }
      .ms h2 {
        font-size: 17px;
        margin: 0 0 4px;
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      .ms h2 .k {
        color: var(--faint);
        font: 13px var(--mono);
      }
      .ms .sum {
        color: var(--muted);
        margin: 0 0 10px;
        max-width: 70ch;
      }
      .ms .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 13px;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 10px;
        background: none;
        font: 13px var(--sans);
        color: var(--ink);
        cursor: pointer;
        text-decoration: none;
      }
      .chip:hover {
        background: var(--soft);
      }
      .ms .grp {
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--faint);
        margin: 10px 0 4px;
      }
      .files {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 8px;
      }
      .file {
        display: flex;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
        background: none;
        text-align: left;
        font: 13px/1.4 var(--sans);
        color: var(--ink);
        cursor: pointer;
      }
      .file:hover {
        background: var(--soft);
      }
      .file .ic {
        font: 600 10px var(--mono);
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 1px 4px;
        min-width: 34px;
        text-align: center;
      }
      #viewer {
        position: absolute;
        inset: 0;
        z-index: 40;
        background: #fff;
        display: none;
        grid-template-rows: auto 1fr;
      }
      #viewer.open {
        display: grid;
      }
      #viewer .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
      }
      #viewer .bar b {
        font-size: 14px;
      }
      #viewer .bar .src {
        color: var(--faint);
        font: 12px var(--mono);
        flex: 1;
        min-width: 0;
      }
      #v-body {
        min-height: 0;
      }
      #viewer iframe,
      #viewer .imgwrap {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      #viewer .imgwrap {
        overflow: auto;
        text-align: center;
        background: var(--soft);
      }
      #viewer .imgwrap img {
        max-width: 100%;
        height: auto;
        margin: 16px auto;
        box-shadow: 0 0 0 1px var(--line);
      }
      #sheet-about a {
        color: var(--ink);
      }
      #sheet-about h2 {
        font-size: 17px;
        margin: 26px 0 6px;
      }
      #sheet-about code {
        font: 13px var(--mono);
        background: var(--soft);
        padding: 1px 4px;
        border-radius: 3px;
      }
      footer {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 20px;
        border-top: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
      }
      footer .note {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      footer .hint {
        font-size: 12px;
        color: var(--faint);
        white-space: nowrap;
      }
      footer label {
        display: flex;
        gap: 6px;
        align-items: center;
        white-space: nowrap;
        cursor: pointer;
      }
      kbd {
        font: 11px var(--mono);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 0 4px;
      }
      @media (max-width: 1500px) {
        header .blurb {
          display: none;
        }
      }
      @media (max-width: 1100px) {
        header .facts {
          display: none;
        }
      }
      @media (max-width: 760px) {
        header .blurb,
        footer .hint {
          display: none;
        }
        main {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: 160px 1fr;
        }
        #rail {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        header {
          flex-wrap: wrap;
          gap: 6px 14px;
          padding: 8px 16px;
        }
        header h1 {
          white-space: normal;
          font-size: 15px;
          flex: 1 1 100%;
        }
        .row {
          flex-wrap: wrap;
        }
        footer {
          padding: 8px 16px;
        }
        footer .note {
          display: none;
        }
        #brief,
        .sheet {
          padding: 24px 16px;
        }
        #brieftext {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>{{NAME}}</h1>
        <div class="blurb">{{BLURB}}</div>
        <div class="facts">{{FACTS}}</div>
        <nav>
          <a id="ms-link"><b>里程碑成品</b></a
          ><a id="about-link">關於這段錄影</a><a href="{{REPO}}">原始碼</a>
        </nav>
      </header>
      <main>
        <div id="rail" role="list"></div>
        <div id="stage">
          <div id="screen">
            <div id="player"></div>
            <div id="brief" class="overlay">
              <div class="label" id="brieflabel"></div>
              <div id="brieftext"></div>
              <div id="briefnote"></div>
              <div class="row">
                <button class="btn" id="btn-start">START</button>
                <button class="btn ghost" id="btn-peek">
                  先看上一章的回答
                </button>
                <button class="btn ghost hidden" id="btn-ms">
                  這一章的成品
                </button>
                <button class="btn ghost" id="btn-about2">這是什麼？</button>
              </div>
            </div>
            <div id="endbar" class="hidden">
              <span id="endtext"></span>
              <button class="btn" id="btn-next">下一章 ▶</button>
            </div>
            <div id="sheet-ms" class="sheet">
              <button class="close" id="close-ms">關閉</button>
              <div
                class="label"
                style="
                  font-size: 12px;
                  color: var(--faint);
                  letter-spacing: 0.08em;
                  margin-bottom: 10px;
                "
              >
                里程碑成品
              </div>
              <p class="intro">
                每個階段做出來的東西，都取自<b>當時那一版</b>（git 標籤）——IRB
                表單、原始資料、表格、圖、
                往來信件、投稿檔與定稿。點檔案直接預覽；點章節跳到錄影裡做出它的那一段。所有資料與人物皆為模擬。
              </p>
              <div id="ms-list"></div>
            </div>
            <div id="viewer">
              <div class="bar">
                <b id="v-title"></b><span class="src" id="v-src"></span>
                <a class="chip" id="v-open" target="_blank" rel="noopener"
                  >開新分頁</a
                >
                <a class="chip hidden" id="v-pdf" target="_blank" rel="noopener">PDF 原檔</a>
                <a class="chip hidden" id="v-dl" download>下載原檔</a>
                <button class="chip" id="v-close">關閉</button>
              </div>
              <div id="v-body"></div>
            </div>
            <div id="sheet-about" class="sheet">
              <button class="close" id="close-about">關閉</button>
              <div class="body">{{ABOUT}}</div>
            </div>
          </div>
          <footer>
            <span class="note" id="note"></span>
            <label
              ><input type="checkbox" id="pausemode" checked />
              每章停下來看題目</label
            >
            <span class="hint"
              ><kbd>[</kbd> <kbd>]</kbd> 章節 · <kbd>space</kbd> 下一步 ·
              <kbd>Esc</kbd> 關閉</span
            >
          </footer>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/asciinema-player@3.17.0/dist/bundle/asciinema-player.min.js"></script>
    <script>
      var CHAPTERS = {{CHAPTERS}};
      var KEYS = {{KEYS}};
      // Progressive load: start on demo.head.cast (first ~5 min), fetch demo.cast
      // in the background and swap when it arrives (see swapToFull).
      var HEAD_END = {{HEAD_END}}, SRC = "demo.head.cast", full = null, waitingFull = false;
      var cur = -1, player = null, pauseMode = true;
      // What Space does next: "brief" → play this chapter; "playing" → pause;
      // "paused" → resume; "ended" → this chapter's answer is on screen, show the next brief.
      var state = "brief", endedAt = -1;
      var $ = function (id) { return document.getElementById(id); };
      var THEME = { foreground: "#1c1917", background: "#ffffff",
        palette: "#1c1917:#cf222e:#1a7f37:#9a6700:#0969da:#8250df:#1b7c83:#57534e:#57534e:#cf222e:#1a7f37:#9a6700:#0969da:#8250df:#1b7c83:#8c8681" };

      function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
      function emphasise(s) {
        var h = esc(s);
        KEYS.forEach(function (k) { if (k) h = h.split(esc(k)).join("<b>" + esc(k) + "</b>"); });
        return h;
      }
      function clock(t) {
        t = Math.floor(t); var h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
        return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
      }

      function rail() {
        var lastPart = null;
        CHAPTERS.forEach(function (c, i) {
          if (c.kind === "stage" && c.part !== lastPart) {
            var p = document.createElement("div"); p.className = "part"; p.textContent = c.part; $("rail").appendChild(p);
            lastPart = c.part;
          }
          var b = document.createElement("button");
          if (c.kind === "say") b.className = "say";
          b.innerHTML = '<span class="n">' + (c.kind === "say" ? "↳" : c.id) + '</span><span>' + esc(c.kind === "say" ? "補充一句" : c.name) +
            '</span><span class="t">' + clock(c.t) + '</span>';
          b.onclick = function () { go(i, true); };
          $("rail").appendChild(b);
        });
      }

      function highlight(i) {
        cur = i;
        document.querySelectorAll("#rail button").forEach(function (b, j) {
          b.setAttribute("aria-current", j === i ? "true" : "false");
          if (j === i) b.scrollIntoView({ block: "nearest" });
        });
        var c = CHAPTERS[i];
        $("note").textContent = c ? (c.kind === "say" ? "補充：" + c.prompt : c.id + " · " + c.part + " · " + c.name) : "";
        if (c) history.replaceState(null, "", "#" + c.id);
      }

      function brief(i) {
        var c = CHAPTERS[i];
        $("brieflabel").textContent = c.kind === "say" ? "補充一句（不在腳本裡）" : c.part + " · " + c.id + " · " + c.name;
        $("brieftext").innerHTML = emphasise(c.prompt);
        $("briefnote").textContent = c.kind === "say"
          ? "AI 停下來需要回應時，錄影者補上的話。照實保留。"
          : "";
        msButton(c);
        state = "brief";
        $("endbar").classList.add("hidden");
        $("brief").classList.remove("hidden");
        $("btn-start").focus();
      }

      function go(i, seek) {
        if (i < 0 || i >= CHAPTERS.length) return;
        highlight(i);
        closeSheets();
        if (seek && player) { player.pause(); if (!needsFull(i)) player.seek({ marker: i }); }
        brief(i);
      }

      function needsFull(i) { return !full && CHAPTERS[i] && CHAPTERS[i].t >= HEAD_END; }
      function start() {
        if (needsFull(cur)) { waitingFull = true; $("btn-start").textContent = "載入中…"; return; }
        $("brief").classList.add("hidden");
        $("endbar").classList.add("hidden");
        if (!player) return;
        state = "playing";
        // Resume from this chapter's marker: covers the first START (player still at 0)
        // and a pause on a marker alike, and never re-triggers the same pause.
        Promise.resolve(player.seek({ marker: cur })).then(function () { player.play(); });
      }
      // Stop on the last frame of a chapter instead of running into the next one.
      function chapterEnded(last) {
        endedAt = cur; state = "ended";
        var n = CHAPTERS[cur + 1];
        $("endtext").textContent = last || !n ? "全片結束"
          : "這一章結束 · 空白鍵 → 下一章：" + (n.kind === "say" ? "補充一句" : n.id + " " + n.name);
        $("btn-next").classList.toggle("hidden", last || !n);
        $("endbar").classList.remove("hidden");
      }
      function next() { go(cur + 1, false); }
      function step() {
        if (state === "brief") start();
        else if (state === "ended") next();
        else if (state === "playing") { player.pause(); state = "paused"; }
        else { $("endbar").classList.add("hidden"); player.play(); state = "playing"; }
      }
      setInterval(function () {
        var c = CHAPTERS[cur];
        if (!pauseMode || !player || state !== "playing" || !c || !c.end || endedAt === cur) return;
        Promise.resolve(player.getCurrentTime()).then(function (t) {
          // +2 s lets the final repaint land; the recording holds each answer ~9 s before the next marker.
          if (state === "playing" && endedAt !== cur && t >= c.end + 2) { player.pause(); chapterEnded(false); }
        });
      }, 250);
      function closeSheets() {
        $("sheet-about").classList.remove("open"); $("sheet-ms").classList.remove("open"); closeViewer();
      }

      // ── Milestones ────────────────────────────────────────────────────────────
      var MS = [];
      var KIND = { pdf: "PDF", file: "FILE", image: "IMG", md: "MD", csv: "CSV", docx: "DOCX", text: "TXT", raw: "DATA" };
      function msFor(id) { return MS.find(function (m) { return m.chapters.indexOf(id) >= 0; }); }
      function chapterIndex(id) { return CHAPTERS.findIndex(function (c) { return c.id === id; }); }
      function fileKind(it) { return KIND[it.kind] || "FILE"; }
      function renderMilestones() {
        var box = $("ms-list"); box.innerHTML = "";
        MS.forEach(function (m, k) {
          var sec = document.createElement("section"); sec.className = "ms"; sec.id = "ms-" + m.id;
          var chs = m.chapters.map(function (id) {
            var c = CHAPTERS[chapterIndex(id)]; return c ? '<button class="chip" data-ch="' + id + '">▶ ' + id + " " + esc(c.name) + "</button>" : "";
          }).join("");
          sec.innerHTML = '<h2><span class="k">' + String(k + 1).padStart(2, "0") + "</span>" + esc(m.title) + "</h2>" +
            '<p class="sum">' + esc(m.summary) + "</p>" +
            '<div class="meta">' + chs + '<a class="chip" target="_blank" rel="noopener" href="' + m.tree + '">git：' + esc(m.ref) + " ↗</a></div>";
          var groups = {};
          m.items.forEach(function (it, j) { var g = it.group || ""; (groups[g] = groups[g] || []).push(j); });
          Object.keys(groups).forEach(function (g) {
            if (g) { var gh = document.createElement("div"); gh.className = "grp"; gh.textContent = g; sec.appendChild(gh); }
            var grid = document.createElement("div"); grid.className = "files";
            groups[g].forEach(function (j) {
              var it = m.items[j], b = document.createElement("button"); b.className = "file";
              b.innerHTML = '<span class="ic">' + fileKind(it) + "</span><span>" + esc(it.label) + "</span>";
              b.onclick = function () { openViewer(m, it); };
              grid.appendChild(b);
            });
            sec.appendChild(grid);
          });
          box.appendChild(sec);
        });
        box.querySelectorAll("[data-ch]").forEach(function (b) {
          b.onclick = function () { closeSheets(); go(chapterIndex(b.getAttribute("data-ch")), true); };
        });
      }
      function openMilestones(id) {
        closeSheets(); if (player) player.pause();
        $("sheet-ms").classList.add("open");
        var el = id && document.getElementById("ms-" + id);
        $("sheet-ms").scrollTop = el ? el.offsetTop - 8 : 0;
      }
      function openViewer(m, it) {
        var url = "milestones/" + m.id + "/" + encodeURIComponent(it.view);
        $("v-title").textContent = it.label;
        $("v-src").textContent = it.src + " @ " + it.ref;
        $("v-open").href = url;
        if (it.download) { $("v-dl").href = "milestones/" + m.id + "/" + encodeURIComponent(it.download); $("v-dl").classList.remove("hidden"); }
        else $("v-dl").classList.add("hidden");
        if (it.pdf) { $("v-pdf").href = "milestones/" + m.id + "/" + encodeURIComponent(it.pdf); $("v-pdf").classList.remove("hidden"); }
        else $("v-pdf").classList.add("hidden");
        $("v-body").innerHTML = it.kind === "image"
          ? '<div class="imgwrap"><img alt="" src="' + url + '"></div>'
          : '<iframe title="' + esc(it.label) + '" src="' + url + '"></iframe>';
        $("v-body").style.minHeight = "0"; $("v-body").firstChild.style.height = "100%";
        $("viewer").classList.add("open");
      }
      function msButton(c) {
        var m = c && c.kind === "stage" ? msFor(c.id) : null;
        $("btn-ms").classList.toggle("hidden", !m);
        $("btn-ms").onclick = function () { if (m) openMilestones(m.id); };
      }
      function closeViewer() { $("viewer").classList.remove("open"); $("v-body").innerHTML = ""; }
      function openAbout() { closeSheets(); $("sheet-about").classList.add("open"); }

      function makePlayer() {
        player = AsciinemaPlayer.create(SRC, $("player"), {
          fit: "both", theme: "her2", terminalFontFamily: "var(--mono)", preload: true,
          pauseOnMarkers: pauseMode // no idleTimeLimit: postprocess already capped idle gaps; a player-side cap would shift time away from chapters.json and cut the answer hold
        });
        player.addEventListener("marker", function (e) {
          highlight(e.index);
          if (pauseMode) brief(e.index);
        });
        player.addEventListener("play", function () { if (state !== "brief") { state = "playing"; $("endbar").classList.add("hidden"); } });
        player.addEventListener("pause", function () { if (state === "playing") state = "paused"; });
        player.addEventListener("ended", function () { chapterEnded(!!full); });
      }

      $("btn-start").onclick = start;
      $("btn-next").onclick = next;
      $("btn-about2").onclick = openAbout;
      // Hide the brief without playing, so the previous answer can be read in full.
      $("btn-peek").onclick = function () { $("brief").classList.add("hidden"); };
      $("close-about").onclick = closeSheets;
      $("about-link").onclick = openAbout;
      $("ms-link").onclick = function () { openMilestones(); };
      $("close-ms").onclick = closeSheets;
      $("v-close").onclick = closeViewer;
      $("pausemode").onchange = function (e) {
        pauseMode = e.target.checked;
        // pauseOnMarkers is fixed at creation: rebuild at the same position.
        var at = player ? player.getCurrentTime() : Promise.resolve(0);
        Promise.resolve(at).then(function (t) {
          if (player) player.dispose();
          $("player").innerHTML = "";
          makePlayer();
          player.seek(t || 0);
        });
      };
      document.addEventListener("keydown", function (e) {
        if (e.target.tagName === "INPUT") return;
        var sheetOpen = document.querySelector(".sheet.open, #viewer.open");
        if (e.key === " " && !sheetOpen) {
          // Capture phase: the player would otherwise toggle play/pause on its own.
          e.preventDefault(); e.stopPropagation(); step(); return;
        }
        if (e.key === "]") go(cur + 1, true);
        else if (e.key === "[") go(cur - 1, true);
        else if (e.key === "Escape") { if ($("viewer").classList.contains("open")) closeViewer(); else closeSheets(); }
      }, true);

      var css = document.createElement("style");
      var pal = THEME.palette.split(":");
      css.textContent = ".asciinema-player-theme-her2{--term-color-foreground:" + THEME.foreground +
        ";--term-color-background:" + THEME.background + ";" +
        pal.map(function (c, n) { return "--term-color-" + n + ":" + c; }).join(";") + "}";
      document.head.appendChild(css);

      // Replace the head player with the full one at the same spot. Only while
      // nothing is moving (brief / chapter end / paused), so the viewer never sees a jump.
      function whenReady(fn) {
        Promise.resolve(player.getDuration()).then(function (d) { d ? fn() : setTimeout(function () { whenReady(fn); }, 100); });
      }
      function swapToFull() {
        if (!full || SRC !== "demo.head.cast") return;
        if (state === "playing" && !waitingFull) return setTimeout(swapToFull, 500);
        Promise.resolve(player.getCurrentTime()).then(function (t) {
          player.dispose(); $("player").innerHTML = "";
          SRC = URL.createObjectURL(new Blob([full])); makePlayer();
          // A seek issued before the new player has parsed the cast is dropped.
          whenReady(function () {
            var at = state === "brief" ? player.seek({ marker: cur }) : player.seek(t || 0);
            Promise.resolve(at).then(function () {
              if (waitingFull) { waitingFull = false; $("btn-start").textContent = "START"; start(); }
            });
          });
        });
      }

      rail();
      makePlayer();
      fetch("demo.cast").then(function (r) { return r.text(); }).then(function (txt) { full = txt; swapToFull(); });
      fetch("milestones.json").then(function (r) { return r.ok ? r.json() : []; }).then(function (j) {
        MS = j; renderMilestones();
        msButton(CHAPTERS[cur]);
        var mh = location.hash.match(/^#m=([\w-]+)/); if (mh) openMilestones(mh[1]);
      }).catch(function () { $("ms-link").style.display = "none"; });
      var h = location.hash.slice(1), i0 = CHAPTERS.findIndex(function (c) { return c.id === h; });
      go(i0 >= 0 ? i0 : 0, i0 > 0);
    </script>
  </body>
</html>
